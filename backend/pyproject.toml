[project]
name = "vocabkids-backend"
version = "0.1.0"
description = "VocabBR Kids — backend (FastAPI). Fatia A (apresentável) + esquema completo do Bloco 1."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    # O extra [asyncio] garante o greenlet em toda plataforma — sem ele o
    # SQLAlchemy só o declara para x86_64/aarch64/win e o runtime async quebra
    # em macOS arm64 ("the greenlet library is required").
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.1",
    "pydantic-settings>=2.2",
    "pyjwt>=2.8",
    # Upload multipart do envio de redação (FastAPI UploadFile).
    "python-multipart>=0.0.9",
    # Fila do pipeline de redação (Bloco 2b) — jobs no próprio Postgres.
    "procrastinate>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
